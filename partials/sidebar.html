<aside class="sidebar">
  <div class="brand">PassHub</div>
  <nav aria-label="メインメニュー">

    <button type="button" class="nav-item" data-view="tools">ツール管理</button>
    <button type="button" class="nav-item" data-view="licenses">ライセンス管理</button>
