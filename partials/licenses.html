<section id="licenses" class="view">
  <div class="page-heading">
    <div>
      <h1>ライセンス管理</h1>
      <p>契約の内容・期限・費用と、席の使用状況を管理します。名前を押すと詳細が開きます。</p>
    </div>
    <div class="heading-actions">
      <button class="secondary-button" id="exportLicensesButton" type="button">CSV出力</button>
      <button class="primary-button admin-only" data-open-form="license" type="button">＋ ライセンスを登録</button>
    </div>
  </div>
  <div class="toolbar">
    <input class="search" id="licenseSearch" type="search" placeholder="ライセンス名・ツール・契約番号・購入先・担当者" aria-label="ライセンスを検索">
    <span id="licenseCount" class="result-count" aria-live="polite"></span>
  </div>
  <div class="panel table-wrap">
    <table>
      <thead>
        <tr>
          <th>ライセンス名</th>
          <th>利用状況</th>
          <th>更新日</th>
          <th>費用（年額換算）</th>
          <th>担当者</th>
          <th>ステータス</th>
          <th><span class="visually-hidden">操作</span></th>
        </tr>
      </thead>
      <tbody id="licensesTable"></tbody>
    </table>
  </div>
</section>
