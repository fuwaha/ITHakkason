<section id="dashboard" class="view active">
  <div class="page-heading">
    <div>
      <h1>ダッシュボード</h1>
      <p>ライセンスの席と、対応が必要なことを確認できます。</p>
    </div>
    <div class="heading-actions">
      <button class="primary-button admin-only" data-open-form="assignment" type="button">＋ 割り当てを登録</button>
    </div>
  </div>

  <div class="metrics" id="metrics"></div>

  <article class="panel alert-panel">
    <div class="panel-heading">
      <h2>対応が必要なこと</h2>
    </div>
    <div id="alertList" class="alert-list"></div>
  </article>

  <div class="section-heading">
    <h2>席の空き状況</h2>
    <button type="button" class="text-button" data-view-target="licenses">ライセンス一覧へ</button>
  </div>
  <div class="pass-grid" id="passList"></div>

  <article class="panel">
    <div class="panel-heading">
      <h2>最近の操作</h2>
      <button type="button" class="text-button" data-view-target="logs">履歴をすべて見る</button>
    </div>
    <div id="recentLogs"></div>
  </article>
</section>
