<section id="loginScreen" class="login-screen" hidden>
  <div class="login-card">
    <!-- 入館パスの上部（ストラップ穴と帯） -->
    <div class="login-band">
      <span class="login-slot" aria-hidden="true"></span>
      <h1 class="login-logo">PassHub</h1>
    </div>

    <!-- ログイン -->
    <form id="loginForm" class="login-body" novalidate>
      <div class="field">
        <label for="loginEmail">メールアドレス</label>
        <input id="loginEmail" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="loginPassword">パスワード</label>
        <div class="password-wrap">
          <input id="loginPassword" type="password" autocomplete="current-password" required aria-describedby="capsLockWarning">
          <button class="password-toggle" type="button" aria-pressed="false" aria-controls="loginPassword">表示</button>
        </div>
        <p id="capsLockWarning" class="caps-warning" role="status" hidden>Caps Lock がオンになっています</p>
      </div>
      <label class="login-remember">
        <input id="rememberEmail" type="checkbox">
        メールアドレスを保存する
      </label>
      <p id="loginError" class="form-error" role="alert" hidden></p>
      <button class="primary-button login-button" type="submit">ログイン</button>
      <details class="login-help" id="forgotPassword">
        <summary>パスワードを忘れた場合</summary>
        <p>管理者にパスワードの再設定を依頼してください。</p>
        <p>再設定後にログインしたら、右上のアイコン →「パスワードを変更」から、自分だけのパスワードに変えてください。</p>
      </details>
      <p class="login-switch">アカウントをお持ちでない方は <button class="link-button" type="button" data-auth-switch="register">利用を申請</button></p>
      <!-- 開発環境（localhost）でだけ auth.js が表示する -->
      <p id="loginHint" class="login-hint" hidden></p>
    </form>

    <!-- 新規登録（画面だけ。送信しても保存されない：register.js） -->
    <form id="registerForm" class="login-body" novalidate hidden>
      <h2 class="login-title">利用申請</h2>
      <p class="login-lead">管理者が承認すると、ログインできるようになります。</p>
      <div class="field">
        <label for="registerName">氏名</label>
        <input id="registerName" type="text" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="registerEmail">メールアドレス</label>
        <input id="registerEmail" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="registerPassword">パスワード</label>
        <div class="password-wrap">
          <input id="registerPassword" type="password" autocomplete="new-password" required aria-describedby="registerPasswordHint registerCapsLock">
          <button class="password-toggle" type="button" aria-pressed="false" aria-controls="registerPassword">表示</button>
        </div>
        <p id="registerPasswordHint" class="field-hint">8文字以上</p>
        <p id="registerCapsLock" class="caps-warning" role="status" hidden>Caps Lock がオンになっています</p>
      </div>
      <div class="field">
        <label for="registerConfirm">パスワード（確認）</label>
        <input id="registerConfirm" type="password" autocomplete="new-password" required>
      </div>
      <p id="registerError" class="form-error" role="alert" hidden></p>
      <p id="registerNotice" class="login-notice" role="status" hidden></p>
      <button class="primary-button login-button" type="submit">利用を申請する</button>
      <p class="login-switch">アカウントをお持ちの方は <button class="link-button" type="button" data-auth-switch="login">ログイン</button></p>
    </form>
  </div>
</section>
