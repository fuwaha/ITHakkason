  <section id="loginScreen" class="login-screen">
    <form id="loginForm" class="login-card">
      <p class="eyebrow">LICENSE MANAGEMENT</p>
      <h1 id="authTitle">ログイン</h1>
      <p id="authDescription" class="login-description">登録済みのアカウントでログインしてください。</p>
      <div id="loginNameField" class="field" hidden><label for="loginName">氏名</label><input id="loginName" type="text" autocomplete="name"></div>
      <div class="field"><label for="loginEmail">メールアドレス</label><input id="loginEmail" type="email" value="admin@example.jp" autocomplete="email" required></div>
      <div class="field"><label for="loginPassword">パスワード</label><input id="loginPassword" type="password" placeholder="demo1234" autocomplete="current-password" required></div>
      <p id="loginError" class="form-error" hidden>メールアドレスまたはパスワードが違います。</p>
      <button class="primary-button login-button" type="submit">ログイン</button>
      <button id="registerToggle" class="text-button auth-toggle" type="button">新しいアカウントを登録する</button>
      <p class="login-hint">初期管理者: admin@example.jp / demo1234</p>
    </form>
  </section>
