<section id="loginScreen" class="login-screen" hidden>
  <div class="login-card">
    <!-- 入館パスの上部（ストラップ穴と帯） -->
    <div class="login-band">
      <span class="login-slot" aria-hidden="true"></span>
      <h1 class="login-logo">PassHub</h1>
    </div>

    <!-- ログインとアカウント登録は、同じフォームを切り替えて使う（auth.js の setAuthMode） -->
    <form id="loginForm" class="login-body">
      <h2 id="authTitle" class="login-title">ログイン</h2>
      <p id="authDescription" class="login-lead">登録済みのアカウントでログインしてください。</p>
      <div id="loginNameField" class="field" hidden><label for="loginName">氏名</label><input id="loginName" type="text" autocomplete="name"></div>
      <div class="field"><label for="loginEmail">メールアドレス</label><input id="loginEmail" type="email" autocomplete="username" required></div>
      <div class="field">
        <label for="loginPassword">パスワード</label>
        <div class="password-wrap">
          <input id="loginPassword" type="password" autocomplete="current-password" required>
          <button class="password-toggle" type="button" aria-pressed="false" aria-controls="loginPassword">表示</button>
        </div>
        <p id="capsLockWarning" class="caps-warning" role="status" hidden>Caps Lock がオンになっています</p>
        <ul id="passwordRules" class="password-rules" aria-label="パスワードの条件" hidden>
          <li data-rule="length">8文字以上</li>
          <li data-rule="letter">英字（a〜z・A〜Z）を含む</li>
          <li data-rule="number">数字（0〜9）を含む</li>
        </ul>
      </div>
      <div id="loginConfirmField" class="field" hidden>
        <label for="loginConfirm">パスワード（確認）</label>
        <div class="password-wrap">
          <input id="loginConfirm" type="password" autocomplete="off" placeholder="先にパスワードを入力してください" disabled>
          <button class="password-toggle" type="button" aria-pressed="false" aria-controls="loginConfirm" disabled>表示</button>
        </div>
      </div>
      <label id="rememberField" class="login-remember">
        <input id="rememberEmail" type="checkbox">
        メールアドレスを保存する
      </label>
      <p id="loginError" class="form-error" role="alert" hidden>メールアドレスまたはパスワードが違います。</p>
      <button class="primary-button login-button" type="submit">ログイン</button>
      <details id="forgotPassword" class="login-help">
        <summary>パスワードを忘れた場合</summary>
        <p>管理者にパスワードの再設定を依頼してください。</p>
        <p>再設定後にログインしたら、アイコンのメニュー →「パスワードを変更」から、自分だけのパスワードに変えてください。</p>
      </details>
      <p class="login-switch"><button id="registerToggle" class="link-button" type="button">新しいアカウントを登録する</button></p>
      <p id="loginHint" class="login-hint" hidden>開発用の初期管理者: admin@example.jp / demo1234</p>
    </form>
  </div>
</section>
