<dialog id="formDialog">
  <form method="dialog" id="entityForm">
    <div class="dialog-heading">
      <h2 id="dialogTitle"></h2>
      <button id="closeFormButton" class="close-button" type="button" aria-label="閉じる">×</button>
    </div>
    <div id="formFields" class="form-fields"></div>
    <p id="formError" class="form-error dialog-error" role="alert" hidden></p>
    <div class="dialog-actions">
      <button id="cancelFormButton" class="secondary-button" type="button">キャンセル</button>
      <button class="primary-button" id="saveButton" value="default" type="submit">保存</button>
    </div>
  </form>
</dialog>
